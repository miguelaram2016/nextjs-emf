name: El Mar Fitness PR checks

on:
  push:
    branches:
      - security/server-side-admin-auth-20261024
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/smoke-admin.mjs'
      - 'package*.json'
      - '.github/workflows/elmar-pr-checks.yml'

permissions:
  contents: read

jobs:
  blog-and-admin:
    name: Build, blog unit tests, admin smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Blog validation unit tests
        run: npm run test:blog
      - name: Lint
        run: npm run lint
      - name: Build production bundle (synthetic environment only)
        run: npm run build
      - name: Exercise server-side admin routes (synthetic credentials)
        run: node scripts/smoke-admin.mjs
